#:schema https://www.schemastore.org/treefmt.json

# The formatter multiplexer - https://github.com/numtide/treefmt
#
# Resources,
# - https://treefmt.com/latest/getting-started/configure/


walk = "git"

excludes = [
	# Don't format third-party code
	"vendor/**",
	# Snapshots must stay identical
	"**/*.snap.html",
]

[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]
options = ["--strict"]
